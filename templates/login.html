<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Global IOT School</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
        background-color: #f1f5f9;
    }
    .login-card-shadow {
        box-shadow: 0px 10px 15px -3px rgba(0,0,0,0.05), 0px 4px 6px -2px rgba(0,0,0,0.05);
    }
</style>
</head>
<body class="flex items-center justify-center min-h-screen font-sans" style="font-family: 'Inter', sans-serif;">

<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(#CBD5E1_1px,transparent_1px)] [background-size:24px_24px]"></div>
</div>

<main class="w-full max-w-[440px] px-4">

    <header class="flex flex-col items-center mb-6">
        <div class="w-16 h-16 mb-4 bg-[#3525cd] rounded-2xl flex items-center justify-center shadow-lg">
            <span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">verified</span>
        </div>
        <h1 class="text-2xl font-bold text-[#3525cd] tracking-tight" style="font-family: 'Geist', sans-serif;">Global IOT School</h1>
        <p class="text-xs text-slate-500 mt-1 uppercase tracking-widest">Admin Console</p>
    </header>

    <div class="bg-white border border-slate-200 rounded-xl p-8 login-card-shadow">

        <div class="mb-6">
            <h2 class="text-xl font-semibold text-slate-900" style="font-family: 'Geist', sans-serif;">Welcome back</h2>
            <p class="text-sm text-slate-500">Please enter your credentials to access the console.</p>
        </div>

        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">error</span>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wide" for="username">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">person</span>
                    </div>
                    <input class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#3525cd]/20 focus:border-[#3525cd] transition-all"
                           id="username" name="username" placeholder="Enter your username" required type="text">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wide" for="password">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <span class="material-symbols-outlined text-[20px]">lock</span>
                    </div>
                    <input class="block w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#3525cd]/20 focus:border-[#3525cd] transition-all"
                           id="password" name="password" placeholder="••••••••" required type="password">
                    <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700 transition-colors" id="togglePassword" type="button">
                        <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
                    </button>
                </div>
            </div>

            <button class="w-full mt-2 py-3 px-4 bg-[#3525cd] text-white font-medium rounded-lg shadow-md hover:bg-[#4f46e5] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                Sign in to Global IOT School
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>

        </form>

    </div>

    <footer class="mt-6 flex justify-center gap-6 text-sm text-slate-500">
        <span class="flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px]">verified_user</span>
            Certificates secured with QR verification
        </span>
    </footer>

</main>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });
</script>

</body>
</html>
