{% extends "layouts/base.html" %}

{% block content %}

<h2>Bulk Import Participants (Excel)</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label>Event</label>
        <select class="form-control" name="event_id" required>
            <option value="">-- Select Event --</option>
            {% for event in events %}
            <option value="{{ event['id'] }}">{{ event['event_name'] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Excel File (.xlsx)</label>
        <input type="file" class="form-control" name="excel_file" accept=".xlsx" required>
    </div>

    <p class="text-muted">
        Required columns: <b>Name</b>, <b>Email</b>.
        Optional columns: College, Department, Position.
    </p>

    <button class="btn btn-primary">Import Participants</button>
    <a href="{{ url_for('participants.participants_list') }}" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
