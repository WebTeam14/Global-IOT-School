{% extends "layouts/base.html" %}

{% block title %}Edit Event | Global IOT School{% endblock %}

{% block content %}

<div class="mb-8">
    <h1 class="text-3xl font-heading font-bold text-on-surface tracking-tight">Edit Event</h1>
    <p class="text-on-surface-variant mt-1">Update event details or switch its certificate template.</p>
</div>

<form method="POST" class="bento-card rounded-xl p-8 max-w-3xl space-y-6">

    <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Event Name</label>
        <input type="text" name="event_name" value="{{ event['event_name'] }}" required
               class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-sm font-medium text-on-surface mb-1.5">Event Date</label>
            <input type="date" name="event_date" value="{{ event['event_date'] }}" required
                   class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-on-surface mb-1.5">Organizer</label>
            <input type="text" name="organizer" value="{{ event['organizer'] }}" required
                   class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Venue</label>
        <input type="text" name="venue" value="{{ event['venue'] }}"
               class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
    </div>

    <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Description</label>
        <textarea name="description" rows="3"
                  class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">{{ event['description'] }}</textarea>
    </div>

    <div>
        <label class="block text-sm font-medium text-on-surface mb-1.5">Certificate Template</label>
        <select name="template_id"
                class="w-full rounded-lg border border-outline-variant px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            <option value="" {% if not event['template_id'] %}selected{% endif %}>-- Select a Template --</option>
            {% for template in templates %}
            <option value="{{ template['id'] }}" {% if event['template_id'] == template['id'] %}selected{% endif %}>
                {{ template["template_name"] }}
                {% if template["template_type"] == "svg" %}(SVG){% else %}(Legacy image){% endif %}
            </option>
            {% endfor %}
        </select>
        <p class="text-xs text-on-surface-variant mt-1.5">
            Don't see the template you need?
            <a href="{{ url_for('templates.upload_template') }}" class="text-primary font-medium hover:underline">Upload a new SVG template</a>.
        </p>
    </div>

    <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="px-6 py-3 bg-primary text-on-primary font-medium rounded-lg shadow-md hover:bg-primary-container transition-all active:scale-95">
            Update Event
        </button>
        <a href="{{ url_for('events.events') }}"
           class="px-6 py-3 text-on-surface-variant font-medium rounded-lg hover:bg-surface-container-low transition-all">
            Cancel
        </a>
    </div>

</form>

{% endblock %}
